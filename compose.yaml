services:
  student-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: student-api:1.0
    container_name: student-api-compose
    ports:
      - "5001:5001"
    env_file:
      - .env
    volumes:
      - student-api-data:/app/instance
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5001/health', timeout=3)"
        ]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  student-api-data:
