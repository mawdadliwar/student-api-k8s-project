<svg width="680" height="480" viewBox="0 0 680 480" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Task 3 Kubernetes architecture diagram</title>
<desc>Ubuntu host containing Docker engine containing a Kind Kubernetes cluster with a control plane, two worker nodes running test pods, and a Service in front of the workers.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="680" height="480" fill="#ffffff"/>

<rect x="40" y="35" width="600" height="400" rx="20" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="52" y="60" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Ubuntu host (native, dual-boot)</text>
<text x="52" y="77" font-family="Arial, sans-serif" font-size="12" fill="#444441">Ryzen 5 3500u &#183; 8 cores &#183; ~5.7GB RAM</text>

<rect x="60" y="95" width="560" height="320" rx="16" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="72" y="120" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#042C53">Docker engine (container runtime)</text>
<text x="72" y="137" font-family="Arial, sans-serif" font-size="12" fill="#0C447C">Hosts all Kind node containers</text>

<rect x="80" y="155" width="520" height="240" rx="14" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="92" y="180" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#26215C">Kind cluster: student-platform</text>
<text x="92" y="197" font-family="Arial, sans-serif" font-size="12" fill="#3C3489">kubectl v1.36.3 &#183; Kubernetes v1.34.0</text>

<rect x="100" y="215" width="145" height="64" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="172" y="239" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Control plane</text>
<text x="172" y="261" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#444441">Manages cluster</text>

<rect x="265" y="215" width="145" height="64" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="337" y="239" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#04342C">Worker node</text>
<text x="337" y="261" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#085041">Runs test pods</text>

<rect x="430" y="215" width="145" height="64" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="502" y="239" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#04342C">Worker node</text>
<text x="502" y="261" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#085041">Runs test pods</text>

<line x1="337" y1="279" x2="320" y2="319" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="502" y1="279" x2="360" y2="319" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="190" y="319" width="300" height="56" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="340" y="341" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#4A1B0C">Service (ClusterIP)</text>
<text x="340" y="361" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#712B13">Stable endpoint routing to pods</text>
</svg>
